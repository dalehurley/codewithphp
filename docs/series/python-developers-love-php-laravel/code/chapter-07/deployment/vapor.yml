# filename: vapor.yml
# Laravel Vapor serverless deployment configuration

id: 12345
name: my-laravel-app

environments:
  production:
    domain: myapp.com
    memory: 1024
    cli-memory: 512
    runtime: php-8.4
    build:
      - 'composer install --no-dev --optimize-autoloader'
      - 'php artisan config:cache'
      - 'php artisan route:cache'
      - 'php artisan view:cache'
    deploy:
      - 'php artisan migrate --force'

