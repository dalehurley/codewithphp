name: bang-for-buck

x-shop-environment: &shop-environment
  APP_NAME: Bang for Buck
  APP_ENV: lab
  APP_DEBUG: "false"
  # Fixed key for the isolated lab. Each Compose project owns its own data.
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_DATABASE: shop
  DB_USERNAME: shop
  DB_PASSWORD: shop
  CACHE_STORE: array
  CACHE_PREFIX: 'cache:'
  REDIS_HOST: redis
  REDIS_PREFIX: 'shop:'
  REDIS_CACHE_LOCK_CONNECTION: cache
  REDIS_MAX_RETRIES: "0"
  SESSION_DRIVER: array
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: "45"
  SHOP_SHIPPING_URL: http://shipping:8081

services:
  redis:
    image: redis:8.6.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  php:
    image: bang-for-buck/shop:local
    build: ./shop
    environment:
      <<: *shop-environment
      SHOP_OPCACHE: "${SHOP_OPCACHE:-1}"
    volumes:
      - exports:/app/storage/app/private
    cpus: 1.0
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.28.2-alpine
    ports:
      - "127.0.0.1:${SHOP_PORT:-8088}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  worker:
    image: bang-for-buck/shop:local
    pull_policy: never
    init: true
    user: www-data
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=3", "--timeout=20"]
    environment: *shop-environment
    volumes:
      - exports:/app/storage/app/private
    depends_on:
      db:
        condition: service_healthy

  shipping:
    image: bang-for-buck/shop:local
    pull_policy: never
    init: true
    user: www-data
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
      SHOP_SHIPPING_EXTRA_MS: "${SHOP_SHIPPING_EXTRA_MS:-0}"
    command: ["php", "-S", "0.0.0.0:8081", "/app/shipping.php"]

  k6:
    image: grafana/k6:1.8.0
    profiles: [bench]
    volumes:
      - ./bench:/lab:ro

volumes:
  database:
  exports:
