server {
    listen 8080;
    access_log off;

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        fastcgi_pass php:9001;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php:9000;
    }
}
